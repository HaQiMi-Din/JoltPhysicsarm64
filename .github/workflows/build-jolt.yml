name: Build Jolt Android ARM64
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JoltPhysics
        uses: actions/checkout@v4
        with:
          repository: jrouwe/JoltPhysics
          ref: master
          submodules: true

      - name: Setup Android NDK r27c
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install build tools
        run: sudo apt update && sudo apt install -y cmake ninja-build

      - name: CMake & Build
        env:
          NDK_PATH: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_PATH}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DJOLT_BUILD_TESTS=OFF \
            -DJOLT_BUILD_SAMPLES=OFF \
            -DJOLT_BUILD_PROFILER=OFF \
            -G Ninja
          ninja

      - name: Upload libJolt.so
        uses: actions/upload-artifact@v4
        with:
          name: libJolt-android
          path: build/libJolt.so
